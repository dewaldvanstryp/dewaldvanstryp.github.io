<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111c" />
  <title>Dewald van Stryp | CV</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { min-height: 100vh; }
    .cv-page { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 40px; }
    .cv-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .cv-toolbar h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); letter-spacing: -0.03em; }
    .cv-toolbar p { margin: 5px 0 0; color: var(--muted); }
    .cv-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .pdf-frame { width: 100%; height: calc(100vh - 165px); min-height: 650px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
    .loading-card { padding: 50px 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); text-align: center; }
    .loading-card p { color: var(--muted); }
    @media (max-width: 650px) { .pdf-frame { height: 75vh; min-height: 520px; } .cv-actions .button { width: auto; } }
  </style>
</head>
<body>
  <main class="cv-page">
    <div class="cv-toolbar">
      <div>
        <p class="eyebrow">CV</p>
        <h1>Dewald van Stryp</h1>
        <p>IT Support • Help Desk • Junior IT Technician</p>
      </div>
      <div class="cv-actions">
        <a class="button secondary" href="index.html">Back to Portfolio</a>
        <a class="button primary" id="downloadCv" href="#" download="Dewald_van_Stryp_IT_CV.pdf">Download CV</a>
      </div>
    </div>

    <div id="loading" class="loading-card">
      <h2 style="font-size:1.6rem;">Loading CV…</h2>
      <p>I’m preparing the PDF for viewing.</p>
    </div>
    <iframe id="pdfFrame" class="pdf-frame" title="Dewald van Stryp CV" hidden></iframe>
  </main>

  <script>
    async function loadCv() {
      const loading = document.getElementById('loading');
      const frame = document.getElementById('pdfFrame');
      const download = document.getElementById('downloadCv');

      try {
        const response = await fetch('Dewald_van_Stryp_IT_CV.pdf', { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not fetch CV data');

        const base64 = (await response.text()).replace(/\s+/g, '');
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

        const blob = new Blob([bytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);

        frame.src = url;
        download.href = url;
        loading.hidden = true;
        frame.hidden = false;
      } catch (error) {
        loading.innerHTML = '<h2 style="font-size:1.6rem;">CV could not be loaded</h2><p>Please return to the portfolio and try again.</p><a class="button secondary" href="index.html">Back to Portfolio</a>';
      }
    }

    loadCv();
  </script>
</body>
</html>
